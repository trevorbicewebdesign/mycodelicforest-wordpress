# Settings shared by the seed scripts and CI. Tracked in git; written by the test kit's setup.sh.
# Machine-specific values (paths, ports, credentials) live in bin/local-env.sh, which is not.

# The developer's own database. Scripts only ever read it (bin/build-seed.sh site).
SITE_DB='local'
# Acceptance/functional tests, and integration tests.
SEED_DB='seed'
TEST_DB='test'
DB_PREFIX='wp_'

# Plugins the seed has deactivated, space separated: the ones that are not installed by Composer
# or tracked in git (they do not exist in CI), and the ones that belong to the hosting
# environment rather than to the site (SSL, caching, firewalls).
# camp-manager is deactivated too: bin/ci-fixtures.sh activates it, so its tables are created from
# the current schema rather than carried in the dump.
SEED_DEACTIVATE_PLUGINS='wordfence civicrm camp-manager'

# Tables, without the prefix, that hold only people, logs or caches, as a regular expression.
# They are emptied in the seed on top of the standard list in bin/build-seed.sh.
SEED_EMPTY_TABLES_EXTRA='mf_[a-z0-9_]*'

# Defaults for CI (GitHub's runner MySQL); bin/local-env.sh overrides them on this machine.
DB_USER="${DB_USER:-root}"
DB_PASS="${DB_PASS:-root}"
DB_HOST="${DB_HOST:-127.0.0.1}"
DB_PORT="${DB_PORT:-3306}"
