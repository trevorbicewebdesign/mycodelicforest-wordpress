actor: FunctionalTester
suite_namespace: Tests\Functional
modules:
    # enable helpers as array
    enabled:
        - lucatume\WPBrowser\Module\WPDb
        - lucatume\WPBrowser\Module\WPFilesystem
        - lucatume\WPBrowser\Module\WPLoader
        - lucatume\WPBrowser\Module\WPBrowser
        - Tests\Support\Helper\Functional
        - Tests\Support\Helper\DbHelper
    config:
      lucatume\WPBrowser\Module\WPBrowser:
        url: '%WORDPRESS_URL%'
        adminUsername: '%WORDPRESS_ADMIN_USER%'
        adminPassword: '%WORDPRESS_ADMIN_PASSWORD%'
        adminPath: '/wp-admin'
        # Hyphenated on purpose: Apache never passes header names containing
        # underscores through to PHP, and wp-config.php reads HTTP_X_TEST_REQUEST
        # to pick the seed database. PHP sees the same variable either way.
        headers:
          X-WPBrowser-Request: 1
          X-Test-Request: 1
      lucatume\WPBrowser\Module\WPDb:
          dbUrl: '%WORDPRESS_DB_SEED_URL%'
          dump:
            - 'tests/_support/Data/db/dump.sql'
          populate: true
          cleanup: true
          reconnect: false
          url: '%WORDPRESS_URL%'
          urlReplacement: false
          tablePrefix: '%SEED_TABLE_PREFIX%'
          createIfNotExists: true
      lucatume\WPBrowser\Module\WPFilesystem:
          wpRootFolder: '%WORDPRESS_ROOT_DIR%'
      lucatume\WPBrowser\Module\WPLoader:
          loadOnly: true
          wpRootFolder: "%WORDPRESS_ROOT_DIR%" 
          dbUrl: '%WORDPRESS_DB_SEED_URL%'
          domain: '%WORDPRESS_DOMAIN%'
