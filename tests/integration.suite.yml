# Integration suite configuration
#
# Run integration and "WordPress unit" tests. WPLoader installs a throwaway WordPress into the
# test database (prefix test_) with the plugins and theme below active.

actor: IntegrationTester
bootstrap: _bootstrap.php
modules:
    enabled:
        - lucatume\WPBrowser\Module\WPLoader
        - Tests\Support\Helper\Integration
        - \Helper\BwbHelper\BwbHelper
        - \Helper\BwbHelper\WordpressDbHandler
        - Asserts
    config:
        lucatume\WPBrowser\Module\WPLoader:
           wpRootFolder: "%WORDPRESS_ROOT_DIR%"
           dbUrl: '%WORDPRESS_DB_TEST_URL%'
           wpDebug: true
           tablePrefix: '%TEST_TABLE_PREFIX%'
           domain: '%WORDPRESS_DOMAIN%'
           adminEmail: 'admin@%WORDPRESS_DOMAIN%'
           title: 'Integration Tests'
           configFile: 'tests/integration-config.php'
           # Only the site's plugin: the camp-manager tests activate that plugin themselves.
           plugins: [
            'mycodelic-forest/mycodelic-forest.php'
           ]
           theme: 'spectra-one'
