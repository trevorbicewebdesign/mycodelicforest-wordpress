name: Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  PHP_VERSION: '8.4'  # must match composer.json config.platform.php and production
  COMPOSER_VERSION: 'v2'
  # One cache layer: everything Composer installs, WordPress core included (it is the package
  # roots/wordpress-no-content under vendor/; bin/install-core.php copies it into the web root).
  # The repo's own code is not in it: it is checked out fresh every run, and the layer is
  # restored over it. Directory names never collide with Composer-managed plugins/themes.
  PACKAGE_PATHS: |    # key: composer.lock
    vendor/
    wp-content/plugins/
    wp-content/themes/

jobs:
  # Builds the cache layers once, so the parallel test jobs below only ever restore them.
  setup:
    name: Build dependency caches
    runs-on: ubuntu-latest
    outputs:
      packages-key: ${{ steps.keys.outputs.packages }}

    steps:
      # Only what Composer needs; the rest of the repo would end up inside the caches.
      - name: Checkout composer files
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            composer.json
            composer.lock
            bin/install-core.php
            .github/actions
            bin/check-seed-clean.php
            tests/_support/Data/db
          sparse-checkout-cone-mode: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:${{ env.COMPOSER_VERSION }}

      # The dumps are committed: fail fast, before anything is built, if one carries personal
      # data or credentials. Never prints the offending values.
      - name: Check test databases hold no personal data or secrets
        run: php bin/check-seed-clean.php

      - name: Compute cache keys
        id: keys
        run: echo "packages=${{ runner.os }}-composer-packages-${{ hashFiles('composer.lock') }}" >> "$GITHUB_OUTPUT"

      # Composer packages. An exact hit needs no work. On a miss, the newest
      # earlier entry is restored anyway (restore-keys) and `composer install` then
      # changes only the packages that differ from the lock file, so one plugin update
      # does not reinstall all of them.
      - name: Restore Composer packages layer
        id: packages
        uses: actions/cache@v5
        with:
          path: ${{ env.PACKAGE_PATHS }}
          key: ${{ steps.keys.outputs.packages }}
          restore-keys: |
            ${{ runner.os }}-composer-packages-
      # The download cache only matters when something has to be fetched.
      - name: Locate Composer download cache
        if: steps.packages.outputs.cache-hit != 'true'
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Restore Composer download cache
        if: steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-downloads-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-downloads-
      - name: Authenticate Composer with GitHub
        if: steps.packages.outputs.cache-hit != 'true'
        uses: ./.github/actions/composer-auth
        with:
          token: ${{ secrets.COMPOSER_AUTH }}
      # --no-scripts: the copy of core into the web root (bin/install-core.php) is not part
      # of the cache; every test job does it after restoring the layer.
      - name: Install Composer dependencies
        if: steps.packages.outputs.cache-hit != 'true'
        run: |
          mkdir -p wp-content/plugins wp-content/themes
          composer install --no-interaction --no-progress --optimize-autoloader --no-scripts

  run-tests:
    name: Test ${{ matrix.test-type }}${{ matrix.group && format(' ({0})', matrix.group) || '' }}
    needs: [setup]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Allow tests to continue even if some fail
      # Every entry is a fully isolated runner with its own MySQL and seed database, so
      # acceptance shards cannot interfere with each other. `group` is a Codeception group
      # (#[Group('...')] on the Cest classes); locally: ./tests/run acceptance --group camp-budgets
      matrix:
        include:
          - test-type: integration
          - test-type: functional
          - test-type: acceptance
            group: camp-budgets
          - test-type: acceptance
            group: camp-receipts
          - test-type: acceptance
            group: camp-roster
          - test-type: acceptance
            group: camp-ledger
          - test-type: acceptance
            group: profile
          - test-type: acceptance
            group: site

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:${{ env.COMPOSER_VERSION }}, wp-cli

      # Restore the cache layer built by `setup` over the checkout. A miss here is an
      # error (evicted or never built), not something to paper over with a download.
      - name: Restore Composer packages layer
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.PACKAGE_PATHS }}
          key: ${{ needs.setup.outputs.packages-key }}
          fail-on-cache-miss: true
      - name: Put WordPress core in the web root
        run: php bin/install-core.php

      # The site's own wp-config.php is never committed; CI has its own, with no secrets in it.
      - name: Create wp-config.php and tests/.env
        run: |
          cp ./tests/wp-config.ci.php ./wp-config.php
          cp ./tests/.env.ci ./tests/.env

      - name: Start and Setup MySQL
        run: |
          sudo systemctl start mysql.service
          sudo systemctl status mysql.service
          source bin/seed.conf
          mysql -u root -proot -h 127.0.0.1 -e "CREATE DATABASE IF NOT EXISTS \`${SEED_DB}\`; CREATE DATABASE IF NOT EXISTS \`${TEST_DB}\`;"

      # The committed dump is built by bin/build-seed.sh: scrubbed of all personal data and
      # credentials (the setup job fails the run if that ever regresses), with the config that
      # does not follow the repo already baked in. bin/ci-fixtures.sh adds what follows the
      # code under test, so it can never go stale. Test data is not seeded here: each Cest
      # resets to the seed and creates what it needs with tests/_support/Helper/DbHelper.php.
      - name: Prepare test fixtures
        run: |
          mkdir -p wp-content/uploads
          source bin/seed.conf
          mysql -u root -proot -h 127.0.0.1 "${SEED_DB}" < tests/_support/Data/db/dump.sql
          bin/ci-fixtures.sh

      - name: Restart Chromedriver
        if: ${{ matrix.test-type == 'acceptance' }}
        run: |
          ./vendor/bin/codecept chromedriver:update
          ./vendor/bin/codecept dev:restart

      # Start the Apache + PHP-FPM server for the functional and acceptance suites
      - name: Start Apache Server
        if: ${{ matrix.test-type != 'integration' }}
        uses: ./.github/actions/setup-apache
        with:
          php-version: ${{ env.PHP_VERSION }}

      # Point PHP's sendmail_path at Mailpit so wp_mail() lands there (tests/.env.ci has its API).
      - name: Start Mailpit
        if: ${{ matrix.test-type == 'acceptance' }}
        run: |
          set -euo pipefail
          curl -sSL https://github.com/axllent/mailpit/releases/latest/download/mailpit-linux-amd64.tar.gz | sudo tar -xz -C /usr/local/bin mailpit
          nohup mailpit --smtp 127.0.0.1:1025 --listen 127.0.0.1:8025 > mailpit.log 2>&1 &
          printf 'sendmail_path = "/usr/local/bin/mailpit sendmail --smtp-addr 127.0.0.1:1025"\n' | sudo tee "/etc/php/${{ env.PHP_VERSION }}/fpm/conf.d/99-mailpit.ini" >/dev/null
          sudo systemctl restart "php${{ env.PHP_VERSION }}-fpm"
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8025/api/v1/info >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8025/api/v1/info | head -c 200; echo

      - name: Run ${{ matrix.test-type }} tests${{ matrix.group && format(' ({0})', matrix.group) || '' }}
        env:
          SUITE: ${{ matrix.test-type }}
          GROUP: ${{ matrix.group }}
        run: |
          args=(-d --no-interaction --skip-group=skipCI --html)
          if [ -n "${GROUP}" ]; then args+=(--group "${GROUP}"); fi
          ./vendor/bin/codecept run "${SUITE}" "${args[@]}"

      # The seed-data helpers (tests/_support/Helper/DbHelper.php) need only MySQL and the
      # prepared seed, so they ride along in the integration job instead of costing a runner.
      - name: Run seed helper tests
        if: ${{ matrix.test-type == 'integration' }}
        run: ./vendor/bin/codecept run db -d --no-interaction --skip-group=skipCI --html

      - name: Upload Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.test-type }}${{ matrix.group && format('-{0}', matrix.group) || '' }}-test-artifacts-${{ github.sha }}
          path: |
            tests/_output/*.html
            tests/_output/*.png
            wp-content/debug.log
            php_errors.log
