# Apache virtual host for the CI functional/acceptance suites; installed by
# .github/actions/setup-apache. ${GITHUB_WORKSPACE} and ${PHP_VERSION} are filled in
# by envsubst there; ${APACHE_LOG_DIR} is left alone for Apache (/etc/apache2/envvars).
#
# Note: Apache never exports request headers whose names contain underscores to
# PHP (CGI env), and there is no directive to allow them. wp-config.php reads
# HTTP_X_TEST_REQUEST to switch to the seed database, so the suites and the CI
# probes send it as "X-Test-Request: 1" (hyphens), which both servers pass through.
<VirtualHost 127.0.0.1:80>
    ServerName localhost
    DocumentRoot "${GITHUB_WORKSPACE}"
    DirectoryIndex index.php index.html

    <Directory "${GITHUB_WORKSPACE}">
        Options FollowSymLinks
        AllowOverride All
        Require all granted

        # WordPress pretty permalinks. The repo ships no .htaccess (it is git-ignored),
        # so these are the rules WordPress would have written to one.
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.php$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.php [L]
    </Directory>

    # PHP-FPM over its Unix socket (the pool runs as the runner user, see the action).
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php${PHP_VERSION}-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Keep PHP/WordPress error bodies instead of Apache's own error pages; they end
    # up in the failure artifacts.
    ProxyErrorOverride Off

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
