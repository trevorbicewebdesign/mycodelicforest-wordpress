upstream php {
    server unix:/run/php/php${PHP_VERSION}-fpm.sock;
}

server {
    listen 127.0.0.1:80;
    root ${GITHUB_WORKSPACE};
    server_name localhost;

    # The test suites mark requests with X_TEST_REQUEST / X_WPBROWSER_REQUEST
    # (underscores). nginx drops such headers unless this is on, and wp-config.php
    # uses HTTP_X_TEST_REQUEST to switch to the seed database.
    underscores_in_headers on;

    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        # Keep PHP/WordPress error bodies (they end up in the failure artifacts).
        fastcgi_intercept_errors off;
        fastcgi_pass unix:/run/php/php${PHP_VERSION}-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PHP_VALUE "error_log=${GITHUB_WORKSPACE}/php_errors.log\nlog_errors=on\n";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
        expires max;
        log_not_found off;
    }
}
